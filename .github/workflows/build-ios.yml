name: Build Ravan Astro iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node & Build Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install
          gem install xcodeproj

      - name: Prepare Capacitor iOS Project
        run: |
          mkdir -p www
          npx cap init "Ravan Astro" "com.ravanastro.app" --web-dir www || true
          npx cap add ios || true
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp -rf ios_src/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/
          npx cap sync ios

      - name: Download and Unpack BeeWare Embedded CPython 3.11
        run: |
          curl -L -o Python-3.11-iOS-support.b10.tar.gz "https://github.com/beeware/Python-Apple-support/releases/download/3.11-b10/Python-3.11-iOS-support.b10.tar.gz"
          tar -xzf Python-3.11-iOS-support.b10.tar.gz
          mkdir -p ios/App/Frameworks
          cp -r Python.xcframework ios/App/Frameworks/
          # Remove standalone include directories to avoid duplicate modulemap definition with Python.framework
          rm -rf ios/App/Frameworks/Python.xcframework/*/include
          # Also place modulemap in Modules folder of Python.framework
          mkdir -p ios/App/Frameworks/Python.xcframework/ios-arm64/Python.framework/Modules
          cp ios/App/Frameworks/Python.xcframework/ios-arm64/Python.framework/Headers/module.modulemap ios/App/Frameworks/Python.xcframework/ios-arm64/Python.framework/Modules/ 2>/dev/null || true
          mkdir -p ios/App/App/python/lib/python3.11
          cp -r Python.xcframework/lib/python3.11/* ios/App/App/python/lib/python3.11/
          cp -r Python.xcframework/ios-arm64/lib-arm64/python3.11/* ios/App/App/python/lib/python3.11/

      - name: Bundle Python Dependencies (Flask, Jinja2, etc.)
        run: |
          mkdir -p ios/App/App/python/lib/python3.11/site-packages
          python3 -m pip install --target ios/App/App/python/lib/python3.11/site-packages flask pytz astral requests

      - name: Bundle Astrology Backend Code & Data
        run: |
          mkdir -p ios/App/App/python_app
          cp app.py swisseph.py ios/App/App/python_app/
          cp -r templates static translations ios/App/App/python_app/
          cp *.json *.txt ios/App/App/python_app/ 2>/dev/null || true

      - name: Compile Native Swiss Ephemeris C Engine (arm64)
        run: |
          xcrun --sdk iphoneos clang -shared -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=14.0 \
            -o ios/App/App/libswisseph.dylib \
            libswe/swecl.c \
            libswe/swedate.c \
            libswe/swehouse.c \
            libswe/swemini.c \
            libswe/swemmoon.c \
            libswe/swemplan.c \
            libswe/sweph.c \
            libswe/swephlib.c \
            libswe/swehel.c \
            libswe/swejpl.c \
            -Ilibswe
          codesign --force --sign - ios/App/App/libswisseph.dylib

      - name: Inject Custom Swift Bridge and Permissions
        run: |
          cp ios_src/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios_src/App-Bridging-Header.h ios/App/App/App-Bridging-Header.h
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationUsageDescription string 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" ios/App/App/Info.plist || true

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          pod install || true

          # Apply build settings strictly to App target
          ruby ../../ios_src/configure_app.rb

          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPEC="" \
                     build 2>&1 | tee xcodebuild.log || {
                       echo "## Xcode Build Failed" >> $GITHUB_STEP_SUMMARY
                       echo '```text' >> $GITHUB_STEP_SUMMARY
                       tail -n 120 xcodebuild.log >> $GITHUB_STEP_SUMMARY
                       python3 -c "import re; txt=open('xcodebuild.log').read(); errs=re.findall(r'(?m)^.*(?:error:|fatal error:).*$', txt); [print('::error::' + e.strip()) for e in errs[:50]]"
                       exit 1
                     }

          # Embed Python Framework, Python standard library, site-packages, backend code, and Swiss Ephemeris
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          mkdir -p "$APP_PATH/Frameworks"
          cp -r "Frameworks/Python.xcframework/ios-arm64/Python.framework" "$APP_PATH/Frameworks/"
          cp -r "App/python" "$APP_PATH/"
          cp -r "App/python_app" "$APP_PATH/"
          cp "App/libswisseph.dylib" "$APP_PATH/"
          cp "App/libswisseph.dylib" "$APP_PATH/Frameworks/"
          cp -rf ../../ios_src/AppIcon.appiconset/*.png "$APP_PATH/" 2>/dev/null || true

          # Ensure Info.plist in the final App bundle contains location descriptions
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Ravan Astro uses your current location to calculate accurate horoscope and panchangam charts.'" "$APP_PATH/Info.plist" || true

          # Ad-hoc sign all shared libraries and embedded binaries
          find "$APP_PATH" -type f \( -name "*.so" -o -name "*.dylib" \) -exec codesign --force --sign - {} +
          codesign --force --sign - --deep "$APP_PATH/Frameworks/Python.framework"
          codesign --force --sign - --deep "$APP_PATH"

          # Create IPA
          mkdir -p ../../build-output/Payload
          cp -r "$APP_PATH" ../../build-output/Payload/
          cd ../../build-output
          zip -r RavanAstro.ipa Payload

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log

      - name: Upload iOS App (.ipa) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavanAstro-iOS-IPA
          path: build-output/RavanAstro.ipa
          retention-days: 14
