<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ravan Astro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 320px;
      width: 100%;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 215, 0, 0.15);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      margin: 0 0 10px 0;
      color: #f59e0b;
      font-size: 22px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>రావణ జ్యోతిష్యం</h2>
    <p>సిద్ధాంత జాతక ఇంజిన్ సిద్ధమవుతోంది...<br><span style="font-size: 12px; color: #64748b;">Starting Offline Engine...</span></p>
  </div>
  <script>
    function checkServer() {
      fetch('http://127.0.0.1:5000/')
        .then(function(res) {
          if (res.ok) {
            window.location.replace('http://127.0.0.1:5000/');
          } else {
            setTimeout(checkServer, 400);
          }
        })
        .catch(function() {
          setTimeout(checkServer, 400);
        });
    }
    setTimeout(checkServer, 300);
  </script>
</body>
</html>
